<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b2545">
<title>Boîte à mots — Psy0</title>
<style>
:root{
  --bg:#0b2545; --bg2:#13315c; --card:#ffffff; --ink:#132437; --muted:#5b7089;
  --accent:#1d6fd8; --accent2:#0fa36b; --gold:#e8a33d; --danger:#c94f4f;
  --radius:18px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);
  color:#fff; min-height:100dvh;
  padding-top:var(--sat); padding-bottom:var(--sab);
  -webkit-text-size-adjust:100%;
}
.screen{max-width:560px;margin:0 auto;padding:16px;display:none;}
.screen.active{display:block;}
h1{font-size:26px;margin:14px 4px 2px;font-weight:800;letter-spacing:.3px;}
.sub{color:#bcd0e8;font-size:14px;margin:0 4px 18px;}
.modes{display:grid;gap:12px;margin-bottom:18px;}
.mode-btn{
  border:0;border-radius:var(--radius);padding:18px 16px;text-align:left;cursor:pointer;
  background:var(--card);color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.25);
  display:flex;align-items:center;gap:14px;font-size:16px;
}
.mode-btn .ico{font-size:30px;}
.mode-btn b{display:block;font-size:17px;}
.mode-btn span.desc{color:var(--muted);font-size:13px;}
.mode-btn.selected{outline:3px solid var(--gold);}
.panel{background:rgba(255,255,255,.08);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.panel h3{margin:2px 4px 10px;font-size:14px;text-transform:uppercase;letter-spacing:1px;color:#bcd0e8;font-weight:700;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.chip{
  border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;
  border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer;
}
.chip.on{background:var(--gold);border-color:var(--gold);color:#132437;font-weight:700;}
select{
  width:100%;font-size:16px;padding:12px;border-radius:12px;border:0;background:var(--card);color:var(--ink);
  appearance:none;-webkit-appearance:none;
}
.start{
  width:100%;border:0;border-radius:var(--radius);padding:17px;font-size:18px;font-weight:800;cursor:pointer;
  background:var(--accent2);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.3);margin-top:4px;
}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.topbar .back{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:999px;padding:9px 15px;font-size:14px;cursor:pointer;}
.counter{font-size:14px;color:#bcd0e8;font-variant-numeric:tabular-nums;}
.card{
  background:var(--card);color:var(--ink);border-radius:22px;padding:20px 16px 16px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);min-height:52dvh;
  display:flex;flex-direction:column;
}
.word{font-size:clamp(30px,9vw,44px);font-weight:800;text-align:center;margin:2px 0 12px;line-height:1.1;}
.meanings{display:grid;gap:14px;flex:1;}
.meaning{display:grid;gap:8px;}
.meaning .catlab{
  font-size:18px;font-weight:800;letter-spacing:.3px;
  color:#fff;background:var(--accent);padding:13px 14px;
  border-radius:14px;text-align:center;
  box-shadow:0 3px 10px rgba(29,111,216,.3);
}
.meaning .catlab.hiddenlab{
  background:repeating-linear-gradient(45deg,#13315c,#13315c 12px,#1b3f74 12px,#1b3f74 24px);
  color:#bcd0e8;font-weight:600;font-size:15px;
}
.imgwrap{position:relative;width:100%;aspect-ratio:4/3;background:#e8eef6;display:flex;align-items:center;justify-content:center;border:1px solid #e3e9f2;border-radius:16px;overflow:hidden;}
.imgwrap img{width:100%;height:100%;object-fit:contain;background:#fff;}
.imgwrap .status{color:var(--muted);font-size:14px;padding:10px;text-align:center;}
.veil{
  position:absolute;inset:0;background:repeating-linear-gradient(45deg,#13315c,#13315c 12px,#1b3f74 12px,#1b3f74 24px);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;
}
.wikilink{font-size:11px;color:#8aa0b8;text-align:right;padding:3px 8px;text-decoration:none;display:block;}
.controls{display:flex;gap:10px;margin-top:14px;}
.ctrl{
  flex:1;border:0;border-radius:16px;padding:16px 8px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;
}
.prev{background:rgba(255,255,255,.16);}
.next{background:var(--accent);}
.reveal{background:var(--gold);color:#132437;flex:1.4;}
.reveal[disabled]{opacity:.35;}
.ctrl:active{transform:scale(.97);}
.foot{text-align:center;color:#8aa0b8;font-size:11px;margin-top:14px;padding-bottom:8px;}
.selcount{font-size:13px;color:#e8a33d;margin:6px 4px 0;}
.catgrid{display:grid;grid-template-columns:1fr;gap:6px;max-height:38dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px;}
.catitem{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:10px;padding:10px 12px;font-size:14.5px;cursor:pointer;}
.catitem input{width:19px;height:19px;accent-color:var(--gold);}
.smallrow{display:flex;gap:8px;margin-bottom:10px;}
.smallbtn{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer;}
.badge{background:var(--accent2);color:#fff;border-radius:999px;font-size:11.5px;font-weight:700;padding:3px 10px;margin-left:8px;vertical-align:middle;}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="home">
  <h1>📦 Boîte à mots</h1>
  <p class="sub">Entraînement vocabulaire — Cadets Air France (Psy0)</p>

  <div class="modes">
    <button class="mode-btn selected" id="mode1btn" onclick="setMode(1)">
      <span class="ico">🖼️</span>
      <span><b>Mode 1 — Présentation</b><span class="desc">Le mot et son image s'affichent ensemble</span></span>
    </button>
    <button class="mode-btn" id="mode2btn" onclick="setMode(2)">
      <span class="ico">🙈</span>
      <span><b>Mode 2 — Révélation</b><span class="desc">L'image reste cachée jusqu'au bouton « Révéler »</span></span>
    </button>
  </div>

  <div class="panel">
    <h3>Ordre</h3>
    <div class="row">
      <button class="chip on" id="ordAlea" onclick="setOrder('alea')">🎲 Aléatoire</button>
      <button class="chip" id="ordAlpha" onclick="setOrder('alpha')">🔤 Alphabétique</button>
    </div>
  </div>

  <div class="panel">
    <h3>Catégories</h3>
    <div class="smallrow">
      <button class="smallbtn" onclick="allCats(true)">Tout cocher</button>
      <button class="smallbtn" onclick="allCats(false)">Tout décocher</button>
    </div>
    <div class="catgrid" id="catgrid"></div>
    <div class="selcount" id="selcount"></div>
  </div>

  <button class="start" onclick="startSession()">Commencer ➜</button>
  <p class="foot">Images : Wikipédia / Wikimedia Commons (connexion Internet requise)</p>
</div>

<!-- CARD -->
<div class="screen" id="play">
  <div class="topbar">
    <button class="back" onclick="goHome()">← Menu</button>
    <span class="counter" id="counter"></span>
    <button class="back" onclick="shuffleNow()" title="Mélanger">🎲</button>
  </div>
  <div class="card">
    <div class="word" id="word"></div>
    <div class="meanings" id="meanings"></div>
  </div>
  <div class="controls">
    <button class="ctrl prev" onclick="nav(-1)">◀ Préc.</button>
    <button class="ctrl reveal" id="revealBtn" onclick="revealOrNext()">👁 Révéler</button>
    <button class="ctrl next" id="nextBtn" onclick="nav(1)">Suiv. ▶</button>
  </div>
  <p class="foot" id="attrib">Images : Wikipédia / Wikimedia Commons</p>
</div>

let mode = 1, order = 'alea', pool = [], idx = 0;
const $ = id => document.getElementById(id);
const imgCache = {}; // key word|catIdx -> {url,page} or null

/* ---------- home ---------- */
function setMode(m){
  mode = m;
  $('mode1btn').classList.toggle('selected', m===1);
  $('mode2btn').classList.toggle('selected', m===2);
}
function setOrder(o){
  order = o;
  $('ordAlea').classList.toggle('on', o==='alea');
  $('ordAlpha').classList.toggle('on', o==='alpha');
}
function buildCats(){
  const g = $('catgrid');
  DATA.cats.forEach((c,i)=>{
    const lab = document.createElement('label');
    lab.className = 'catitem';
    const n = DATA.words.filter(w=>w.c.includes(i)).length;
    lab.innerHTML = `<input type="checkbox" checked data-i="${i}" onchange="updateCount()"> ${c.l} <span style="margin-left:auto;color:#9db4cf;font-size:12px">${n}</span>`;
    g.appendChild(lab);
  });
  updateCount();
}
function allCats(v){
  document.querySelectorAll('#catgrid input').forEach(cb=>cb.checked=v);
  updateCount();
}
function selectedCats(){
  return [...document.querySelectorAll('#catgrid input')].filter(cb=>cb.checked).map(cb=>+cb.dataset.i);
}
function updateCount(){
  const sel = new Set(selectedCats());
  const n = DATA.words.filter(w=>w.c.some(ci=>sel.has(ci))).length;
  $('selcount').textContent = n + ' mots sélectionnés';
}
function startSession(){
  const sel = new Set(selectedCats());
  pool = DATA.words.filter(w=>w.c.some(ci=>sel.has(ci)));
  if(!pool.length){ alert('Sélectionnez au moins une catégorie.'); return; }
  if(order==='alea') shuffle(pool); else pool.sort((a,b)=>a.w.localeCompare(b.w,'fr'));
  idx = 0;
  $('home').classList.remove('active');
  $('play').classList.add('active');
  render();
  window.scrollTo(0,0);
}
function goHome(){
  $('play').classList.remove('active');
  $('home').classList.add('active');
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }
function shuffleNow(){ shuffle(pool); idx=0; render(); }

/* ---------- card ---------- */
function nav(d){
  idx = (idx + d + pool.length) % pool.length;
  render();
}
function render(){
  const item = pool[idx];
  $('counter').textContent = (idx+1) + ' / ' + pool.length;
  $('word').textContent = item.w;
  const box = $('meanings');
  box.innerHTML = '';
  const multi = item.c.length > 1;
  $('word').innerHTML = escapeHtml(item.w) + (multi ? ' <span class="badge">' + item.c.length + ' sens</span>' : '');
  item.c.forEach(ci=>{
    const cat = DATA.cats[ci];
    const div = document.createElement('div');
    div.className = 'meaning';
    const labHtml = mode===2
      ? `<div class="catlab hiddenlab" data-label="${escapeHtml(cat.l)}">❓ Catégorie cachée</div>`
      : `<div class="catlab">${escapeHtml(cat.l)}</div>`;
    div.innerHTML = `${labHtml}
      <div class="imgwrap" id="iw${ci}">
        <div class="status">Chargement…</div>
        ${mode===2 ? '<div class="veil" id="veil'+ci+'">❓</div>' : ''}
      </div>`;
    box.appendChild(div);
    loadImage(item, ci);
  });
  const rb = $('revealBtn'), nb = $('nextBtn');
  revealed = false;
  if(mode===2){
    rb.style.display=''; rb.textContent='👁 Révéler';
    nb.style.display='none';
  } else {
    rb.style.display='none';
    nb.style.display='';
  }
  window.scrollTo(0,0);
}
let revealed = false;
function revealOrNext(){
  if(mode!==2) return;
  if(revealed){ nav(1); return; }
  document.querySelectorAll('.veil').forEach(v=>v.remove());
  document.querySelectorAll('.catlab.hiddenlab').forEach(el=>{
    el.textContent = el.dataset.label;
    el.classList.remove('hiddenlab');
  });
  revealed = true;
  $('revealBtn').textContent = 'Suivant ▶';
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- images (Wikipédia) ---------- */
const BANNED = /disambig|question_book|wiki.?letter|logo|icon|emblem_important|red_pog|ambox|padlock|edit-clear|no_image|placeholder|open_access|wiktionary|commons-logo/i;

function cacheKey(item,ci){ return item.w.toLowerCase()+'|'+ci; }

async function loadImage(item, ci){
  const key = cacheKey(item,ci);
  const holder = document.getElementById('iw'+ci);
  if(!holder) return;
  let res = imgCache[key];
  if(res === undefined){
    try { res = await findImage(item.w, DATA.cats[ci].h); }
    catch(e){ res = null; }
    imgCache[key] = res;
    try { localStorage.setItem('bam_'+key, JSON.stringify(res)); } catch(e){}
  }
  // still the same card?
  if(pool[idx] !== item) return;
  const cur = document.getElementById('iw'+ci);
  if(!cur) return;
  const veil = cur.querySelector('.veil');
  if(res && res.url){
    cur.querySelector('.status')?.remove();
    const img = new Image();
    img.referrerPolicy = 'no-referrer';
    img.onload = ()=>{};
    img.onerror = ()=>{ const s=document.createElement('div'); s.className='status'; s.textContent='Image indisponible'; cur.prepend(s); img.remove(); };
    img.src = res.url;
    cur.prepend(img);
  } else {
    const s = cur.querySelector('.status');
    if(s) s.textContent = navigator.onLine === false ? 'Hors ligne — image indisponible' : 'Aucune image trouvée';
  }
}

async function findImage(word, hint){
  const cached = readLocal(word, hint);
  if(cached !== undefined) return cached;
  // 1. French Wikipedia search: word + category hint
  let r = await wikiSearch('fr.wikipedia.org', word + ' ' + hint);
  // 2. fallback: word alone
  if(!r) r = await wikiSearch('fr.wikipedia.org', word);
  // 3. fallback: Wikimedia Commons file search
  if(!r) r = await commonsSearch(word + ' ' + hint.split(' ')[0]);
  return r;
}
function readLocal(word, hint){
  return undefined; // localStorage read handled via imgCache preload below
}
async function wikiSearch(host, q){
  const url = 'https://' + host + '/w/api.php?action=query&generator=search'
    + '&gsrsearch=' + encodeURIComponent(q) + '&gsrlimit=6&gsrnamespace=0'
    + '&prop=pageimages&piprop=thumbnail&pithumbsize=560&format=json&origin=*';
  const j = await fetchJson(url);
  const pages = j && j.query && j.query.pages ? Object.values(j.query.pages) : [];
  pages.sort((a,b)=>(a.index||99)-(b.index||99));
  for(const p of pages){
    if(p.thumbnail && p.thumbnail.source && !BANNED.test(p.thumbnail.source)){
      return { url: p.thumbnail.source, title: p.title };
    }
  }
  return null;
}
async function commonsSearch(q){
  const url = 'https://commons.wikimedia.org/w/api.php?action=query&generator=search'
    + '&gsrsearch=' + encodeURIComponent('filetype:bitmap ' + q) + '&gsrlimit=6&gsrnamespace=6'
    + '&prop=imageinfo&iiprop=url&iiurlwidth=560&format=json&origin=*';
  const j = await fetchJson(url);
  const pages = j && j.query && j.query.pages ? Object.values(j.query.pages) : [];
  pages.sort((a,b)=>(a.index||99)-(b.index||99));
  for(const p of pages){
    const ii = p.imageinfo && p.imageinfo[0];
    const u = ii && (ii.thumburl || ii.url);
    if(u && !BANNED.test(u)) return { url: u, title: p.title };
  }
  return null;
}
function fetchJson(url){
  return new Promise((resolve,reject)=>{
    const ctl = new AbortController();
    const t = setTimeout(()=>{ ctl.abort(); reject(new Error('timeout')); }, 12000);
    fetch(url, {signal: ctl.signal})
      .then(r=>r.json()).then(j=>{ clearTimeout(t); resolve(j); })
      .catch(e=>{ clearTimeout(t); reject(e); });
  });
}

/* preload persisted cache */
(function(){
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('bam_')){
        try{ imgCache[k.slice(4)] = JSON.parse(localStorage.getItem(k)); }catch(e){}
      }
    }
  }catch(e){}
})();

/* swipe navigation */
(function(){
  let x0=null,y0=null;
  document.addEventListener('touchstart',e=>{ if($('play').classList.contains('active')){ x0=e.touches[0].clientX; y0=e.touches[0].clientY; } },{passive:true});
  document.addEventListener('touchend',e=>{
    if(x0===null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0=null;
    if(Math.abs(dx)>70 && Math.abs(dx)>2*Math.abs(dy)){
      const d = dx<0?1:-1;
      if(mode===2 && !revealed && d===1) return; // pas de "suivant" avant révélation
      nav(d);
    }
  },{passive:true});
})();

/* keyboard (desktop) */
document.addEventListener('keydown',e=>{
  if(!$('play').classList.contains('active')) return;
  if(e.key==='ArrowRight'){
    if(mode===2 && !revealed) revealOrNext(); // révèle d'abord
    else nav(1);
  }
  else if(e.key==='ArrowLeft') nav(-1);
  else if(e.key===' '||e.key==='Enter'){ if(mode===2){ e.preventDefault(); revealOrNext(); } }
});

buildCats();
